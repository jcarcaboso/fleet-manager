# Included at server level (for the error pages nginx generates itself) and again in every location that sets
# its own headers: nginx drops inherited add_header directives as soon as a location defines one. The Content-Security-Policy header depends on
# FLEET_API_ORIGIN and is generated at start-up into /tmp/fleet/csp.conf.
include /tmp/fleet/csp.conf;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), usb=(), xr-spatial-tracking=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
