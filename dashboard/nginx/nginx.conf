# Fleet Manager dashboard: static files over HTTPS on 8443, run as a non-root user on a read-only root.
# Writable paths are all under /tmp (a tmpfs). /tmp/fleet is written by entrypoint.sh.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 1k;
    large_client_header_buffers 4 8k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Log the requested path without its query string, and not the Referer header, so tokens in URLs never reach the log.
    map $request_uri $request_path {
        ~^(?<path>[^?]*) $path;
        default "-";
    }
    # Cache only successful responses. A cached 404 for a file that does not exist yet would stick for a year.
    map $status $hashed_cache_control {
        200 "public, max-age=31536000, immutable";
        304 "public, max-age=31536000, immutable";
        default "no-store";
    }
    map $status $static_cache_control {
        200 "no-cache";
        304 "no-cache";
        default "no-store";
    }
    log_format fleet '$remote_addr [$time_iso8601] "$request_method $request_path $server_protocol" $status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout fleet;

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /run/fleet/tls/server.pem;
        ssl_certificate_key /run/fleet/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        root /srv/dashboard;
        autoindex off;

        # The dashboard is read-only: GET and HEAD only. "add_header" is not allowed in a server-level "if",
        # so the 405 is produced in a named location.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        error_page 405 @method_not_allowed;
        location @method_not_allowed {
            default_type text/plain;
            add_header Allow "GET, HEAD" always;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
            return 405 "Method not allowed\n";
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
            return 200 "ok\n";
        }

        # Written at start-up from FLEET_API_ORIGIN.
        location = /config.json {
            alias /tmp/fleet/config.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }

        # Every fallback ends here, after an internal redirect to /index.html.
        location = /index.html {
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }

        # Vite names these files after their content, so they never change.
        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control $hashed_cache_control always;
            include /etc/nginx/security-headers.conf;
        }

        # No dotfiles anywhere.
        location ~ /\. {
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
            return 404;
        }

        # Application routes (history mode). Node aliases can contain dots, so these come before the file rule.
        location ~ ^/(machines|problems|deployments|repository|models|enrollment|audit|login)(/|$) {
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }

        # Anything else that looks like a file is a file or a 404, never index.html.
        location ~ \.[^/]*$ {
            try_files $uri =404;
            add_header Cache-Control $static_cache_control always;
            include /etc/nginx/security-headers.conf;
        }

        # The root and other extensionless paths: the application shows its own not-found page.
        location / {
            try_files /index.html =404;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/security-headers.conf;
        }
    }
}
