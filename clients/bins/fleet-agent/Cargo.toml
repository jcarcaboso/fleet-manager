[package]
name = "fleet-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
rcgen = { version = "0.14.5", default-features = false, features = ["pem", "crypto", "ring"] }
time = { version = "0.3.44", features = ["parsing"] }
sha2 = "0.10.9"
# Ed25519 verification of the release manifest. Already locked through rcgen.
ring = "0.17.14"
dirs = "6.0.0"
fleet-reconcile = { path = "../../crates/fleet-reconcile" }
toml_edit = "0.25.13"
jsonc-parser = { version = "0.33.2", features = ["cst", "serde_json"] }

[dev-dependencies]
# The Server side of the trust tests. Already locked through reqwest.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[target.'cfg(unix)'.dependencies]
# Disk usage: one statvfs (Linux) or statfs (macOS) call. Already locked as a
# transitive dependency.
libc = "0.2.189"
