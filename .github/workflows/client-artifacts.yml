name: Build and release client artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Match package versions to tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          root = pathlib.Path('clients')
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())
          expected = os.environ['RELEASE_TAG'].removeprefix('v')
          versions = {'workspace': workspace['workspace']['package']['version']}
          for manifest in root.glob('**/Cargo.toml'):
              if manifest == root / 'Cargo.toml':
                  continue
              package = tomllib.loads(manifest.read_text()).get('package')
              if package:
                  package_version = package['version']
                  versions[str(manifest)] = (
                      versions['workspace']
                      if isinstance(package_version, dict) and package_version.get('workspace')
                      else package_version
                  )
          wrong = {name: version for name, version in versions.items() if version != expected}
          if wrong:
              raise SystemExit(f'{os.environ["RELEASE_TAG"]} does not match package versions: {wrong}')
          print(f'all client packages match {os.environ["RELEASE_TAG"]}')
          PY

  linux:
    name: Linux amd64 static clients
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.95.0 fmt --manifest-path clients/Cargo.toml --all -- --check
      - run: cargo +1.95.0 clippy --manifest-path clients/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - name: Build and package
        env:
          FLEET_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/build-cli.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clients-linux-amd64
          path: |
            artifacts/fleet-linux-amd64.tar.gz*
            artifacts/fleet-agent-linux-amd64.tar.gz*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} clients
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.95.0 fmt --manifest-path clients/Cargo.toml --all -- --check
      - run: cargo +1.95.0 clippy --manifest-path clients/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.95.0 test --manifest-path clients/Cargo.toml --workspace --locked
      - run: cargo +1.95.0 build --manifest-path clients/Cargo.toml --workspace --release --locked
      - name: Package
        env:
          FLEET_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/package-native-clients.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clients-macos-${{ matrix.arch }}
          path: artifacts/*-macos-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: clients-*
          path: artifacts
          merge-multiple: true
      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [ -f "$notes" ]; then
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --notes-file "$notes" --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

  homebrew-test:
    name: Test Homebrew formulas on macOS ${{ matrix.arch }}
    if: github.ref_type == 'tag'
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: clients-*
          path: artifacts
          merge-multiple: true
      - name: Generate, install, and test formulas
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          python3 scripts/update-homebrew.py \
            --version "$RELEASE_TAG" \
            --artifacts artifacts \
            --repository "$GITHUB_REPOSITORY"
          brew tap-new fleet-release/check
          tap_dir=$(brew --repository fleet-release/check)
          cp Formula/fleet.rb Formula/fleet-agent.rb "$tap_dir/Formula/"
          brew install fleet-release/check/fleet fleet-release/check/fleet-agent
          brew test fleet-release/check/fleet
          brew test fleet-release/check/fleet-agent

  homebrew:
    name: Update Homebrew formulas
    if: github.ref_type == 'tag'
    needs: [release, homebrew-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: clients-*
          path: artifacts
          merge-multiple: true
      - name: Check tag and generate formulas
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/master
          python3 scripts/update-homebrew.py \
            --version "$RELEASE_TAG" \
            --artifacts artifacts \
            --repository "$GITHUB_REPOSITORY"
      - name: Commit formulas without overwriting a newer release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git add Formula/fleet.rb Formula/fleet-agent.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update Homebrew formulas for $RELEASE_TAG"
          git fetch --no-tags origin master
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/master)"
          git push origin HEAD:master
