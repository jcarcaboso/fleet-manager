name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET Linux tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302
      - run: dotnet restore --locked-mode Fleet.slnx
      - run: dotnet format Fleet.slnx --no-restore --verify-no-changes
      - run: dotnet test Fleet.slnx --no-restore --configuration Release

  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.95.0 fmt --manifest-path clients/Cargo.toml --all -- --check
      - run: cargo +1.95.0 clippy --manifest-path clients/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.95.0 test --manifest-path clients/Cargo.toml --workspace --locked

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/check-doc-links.py

  rust-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file clients/Cargo.lock

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install the browser for the e2e suite
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (mock API, production Content-Security-Policy)
        run: npm run e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-e2e-report
          path: |
            dashboard/playwright-report
            dashboard/test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  dashboard-image:
    name: Dashboard image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compose files
        run: |
          docker compose -f deploy/homelab/compose.yaml config --format json \
            | python3 -c "import json, sys; services = json.load(sys.stdin)['services']; sys.exit('compose.yaml must not build: ' + ', '.join(name for name, service in services.items() if 'build' in service) if any('build' in service for service in services.values()) else 0)"
      - name: Build through compose.build.yaml
        run: docker compose -p fleet-dashboard-build -f deploy/homelab/compose.yaml -f deploy/homelab/compose.build.yaml build dashboard
        env:
          FLEET_DASHBOARD_IMAGE: fleet-dashboard:ci
      - run: scripts/smoke-dashboard-image.sh fleet-dashboard:ci
