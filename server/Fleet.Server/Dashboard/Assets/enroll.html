<body><header>Fleet Manager</header><main><h1>Enroll this machine</h1><section><p>Install the Fleet Agent, then run:</p><pre><code>fleet-agent enroll --link</code></pre><p>Paste the enrollment link at the prompt. Your Agent will generate its identity on the machine and contact the server.</p><label for="link">Enrollment link</label><textarea id="link" readonly rows="5" spellcheck="false"></textarea><button id="copy">Copy link</button><p id="message" role="status"></p><p class="muted">This page does not redeem the link. Keep it private until enrollment completes.</p></section></main></body></html>
