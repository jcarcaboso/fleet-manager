name: fleet-manager

x-server-environment: &server-environment
  Source__Remote: ${FLEET_SOURCE_REMOTE:-}
  Fleet__PublicUrl: ${FLEET_PUBLIC_URL:-https://${FLEET_HOSTNAME:-localhost}:${FLEET_PORT:-7443}}
  Fleet__DashboardOrigin: ${FLEET_DASHBOARD_URL:-https://${FLEET_HOSTNAME:-localhost}:${FLEET_DASHBOARD_PORT:-7444}}
  ASPNETCORE_CONTENTROOT: /run/fleet
  HOME: /home/app

x-server: &server
  image: ${FLEET_IMAGE:-skorcius/fleet-manager:0.12.1}
  user: "1654:1654"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  environment: *server-environment
  volumes:
    - runtime-config:/run/fleet:ro
    - runtime-config:/home/app:ro
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    - /var/lib/fleet:rw,noexec,nosuid,nodev,size=768m,mode=0700,uid=1654,gid=1654
  networks: [backend, outbound]
  mem_limit: 2g
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  configure:
    image: ${FLEET_IMAGE:-skorcius/fleet-manager:0.12.1}
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        # Two private volumes. The Server gets everything it needs (including the CA key that signs Node
        # certificates) in runtime-config, which only 1654 can read. The dashboard gets only its own certificate and
        # key plus the public CA certificate in dashboard-tls. Nothing else goes into that volume. The Server owns it
        # because it renews that certificate, and the dashboard reads it through the group.
        for file in dashboard.pem dashboard.key; do
          if [ ! -r "/input/tls/$$file" ]; then
            echo "configure: secrets/tls/$$file is missing. This installation was created before the dashboard had its own certificate. Run: python3 setup.py --add-dashboard" >&2
            exit 1
          fi
        done
        mkdir -p /runtime/tls /runtime/.ssh
        cp /input/server.json /runtime/appsettings.Production.json
        for file in /input/tls/*; do
          case "$${file##*/}" in dashboard.*) ;; *) cp "$$file" /runtime/tls/ ;; esac
        done
        cp -R /input-ssh/. /runtime/.ssh/
        chown -R 1654:1654 /runtime
        find /runtime -type d -exec chmod 0700 {} +
        find /runtime -type f -exec chmod 0600 {} +
        # The copy in secrets/ only seeds the volume: keep the certificate the Server renewed unless the copy lasts longer.
        expires() { date -d "$$(openssl x509 -in "$$1" -noout -enddate | cut -d= -f2)" +%s; }
        find /dashboard-tls -mindepth 1 ! -name dashboard.pem ! -name dashboard.key -delete
        if [ ! -r /dashboard-tls/dashboard.key ] || [ ! -r /dashboard-tls/dashboard.pem ] ||
          [ "$$(expires /input/tls/dashboard.pem)" -gt "$$(expires /dashboard-tls/dashboard.pem)" ]; then
          cp /input/tls/dashboard.pem /input/tls/dashboard.key /dashboard-tls/
        fi
        cp /input/tls/ca.pem /dashboard-tls/
        chown -R 1654:1654 /dashboard-tls
        chmod 0750 /dashboard-tls
        find /dashboard-tls -type f -exec chmod 0640 {} +
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./secrets:/input:ro
      - ./ssh:/input-ssh:ro
      - runtime-config:/runtime
      - dashboard-tls:/dashboard-tls
    restart: "no"

  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_DB: fleet
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./secrets/postgres-password:/run/secrets/postgres-password:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    <<: *server
    command: [--migrate]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      configure: {condition: service_completed_successfully}

  server:
    <<: *server
    restart: unless-stopped
    environment:
      <<: *server-environment
      Fleet__CliProxyApiKey: ${FLEET_CLIPROXY_API_KEY:-}
      Fleet__CliProxySyncIntervalSeconds: ${FLEET_CLIPROXY_SYNC_INTERVAL_SECONDS:-604800}
      Fleet__DashboardCertificateDirectory: /run/fleet-dashboard-tls
    volumes:
      - runtime-config:/run/fleet:ro
      - runtime-config:/home/app:ro
      - dashboard-tls:/run/fleet-dashboard-tls
    ports:
      - "${FLEET_BIND_IP:-127.0.0.1}:${FLEET_PORT:-7443}:7443"
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "3", --cacert, /run/fleet/tls/ca.pem, https://localhost:7443/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    image: ${FLEET_DASHBOARD_IMAGE:-skorcius/fleet-manager:dashboard-0.12.1}
    restart: unless-stopped
    # Its own uid and its own volume: the dashboard reads dashboard.pem, dashboard.key and the public ca.pem,
    # and nothing else the Server owns (no CA key, Server key, database password or Operator token digests).
    # The group is the Server's so it can read the files the Server renews; that volume is the only one it shares.
    user: "1655:1654"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      FLEET_API_ORIGIN: ${FLEET_PUBLIC_URL:-https://${FLEET_HOSTNAME:-localhost}:${FLEET_PORT:-7443}}
    volumes:
      - dashboard-tls:/run/dashboard-tls:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    ports:
      - "${FLEET_BIND_IP:-127.0.0.1}:${FLEET_DASHBOARD_PORT:-7444}:8443"
    depends_on:
      configure: {condition: service_completed_successfully}
      server: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "3", --cacert, /run/dashboard-tls/ca.pem, https://localhost:8443/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # The dashboard only serves files. It never talks to the Server (the browser does), so it joins neither
    # the backend network nor the Server's outbound network.
    networks: [frontend]
    mem_limit: 2g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    internal: true
  outbound: {}
  frontend: {}

volumes:
  postgres-data: {}
  runtime-config: {}
  dashboard-tls: {}
