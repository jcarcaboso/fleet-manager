services:
  cliproxy-configure:
    image: ${FLEET_IMAGE:?set FLEET_IMAGE to a CLIProxy-compatible release}
    user: "0:0"
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 077
        cp /input/api-key /runtime/.cliproxy-api-key.new
        chown 1654:1654 /runtime/.cliproxy-api-key.new
        chmod 0600 /runtime/.cliproxy-api-key.new
        mv -f /runtime/.cliproxy-api-key.new /runtime/cliproxy-api-key
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${FLEET_CLIPROXY_API_KEY_FILE:?set FLEET_CLIPROXY_API_KEY_FILE}:/input/api-key:ro
      - runtime-config:/runtime
    depends_on:
      configure: {condition: service_completed_successfully}
    restart: "no"

  server:
    environment:
      Fleet__CliProxyApiKeyPath: /run/fleet/cliproxy-api-key
    depends_on:
      cliproxy-configure: {condition: service_completed_successfully}
