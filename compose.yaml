services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet-local-development
      POSTGRES_DB: fleet
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - fleet-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  fleet-postgres:
